<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b3b">
  <meta name="description" content="A personal landing page with links and contact information.">
  <title>Minami Gessel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #f8fcff;
      background: #102b3b;
      font: 1rem/1.6 system-ui, sans-serif;
    }
    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      align-items: center;
      padding: 3rem clamp(1.25rem, 5vw, 5rem);
      background:
        linear-gradient(90deg, #102b3b 18%, #102b3b 33%, #102b3b00 62%),
        url("portrait.png") right center / auto 100% no-repeat,
        #102b3b;
    }
    @media (max-width: 760px) {
      main {
        align-items: end;
        justify-items: center;
        padding-top: min(90vw, 38rem);
        padding-bottom: 1.5rem;
        background:
          linear-gradient(0deg, #102b3b, #102b3b00 48%) top / 100% min(105vw, 44rem) no-repeat,
          url("portrait.png") center top / 100% auto no-repeat,
          #102b3b;
      }
    }
    .intro {
      width: min(100%, 31rem);
      padding: clamp(2rem, 7vw, 4rem) clamp(1.25rem, 5vw, 3.5rem);
      border: 1px solid #e5f4ff4d;
      border-radius: 1.5rem;
      text-align: center;
      background: #102b3bdf;
      box-shadow: 0 1.5rem 5rem #061a2f50;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 9vw, 5rem);
      line-height: 1.03;
      letter-spacing: -0.055em;
      overflow-wrap: anywhere;
    }
    p { margin: 1rem auto 1.75rem; color: #deedf6; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .65rem; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3rem;
      height: 3rem;
      border: 1px solid #b0cfdf91;
      border-radius: 999px;
      color: inherit;
      font-weight: 600;
      text-decoration: none;
    }
    nav svg { width: 1.3rem; height: 1.3rem; }
    a:hover { background: #d7efff; color: #102b3b; border-color: #d7efff; }
    a:focus-visible { outline: 3px solid #c3edff; outline-offset: 4px; }
    a.primary { background: #e9f7ff; color: #102b3b; border-color: #e9f7ff; }
    a.primary:hover { background: #bce8ff; border-color: #bce8ff; }
    .services { margin-top: 1.5rem; }
    .services summary { cursor: pointer; font-weight: 600; }
    .services summary:focus-visible { outline: 3px solid #c3edff; outline-offset: 4px; }
    .services p { margin: .65rem 0 1rem; font-size: .875rem; }
    .services ul {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(4.4rem, 1fr));
      gap: .88rem .4rem;
      max-height: 17rem;
      overflow: auto;
      margin: 0;
      padding: .25rem;
      list-style: none;
      scrollbar-color: #8baab9 #102b3b;
    }
    .services li {
      display: grid;
      justify-items: center;
      align-content: start;
      gap: .3rem;
      font-size: .75rem;
      overflow-wrap: anywhere;
    }
    .service-icon {
      display: grid;
      place-items: center;
      width: 2.5rem;
      height: 2.5rem;
      border: 1px solid #b0cfdf91;
      border-radius: 50%;
      font-weight: 700;
    }
    .service-icon svg { width: 1.15rem; height: 1.15rem; fill: currentColor; }
  </style>
</head>
